plugins {
    id 'java-gradle-plugin'
    id 'groovy'
    id 'idea'
    id 'eclipse'
    alias libs.plugins.licenser
    alias libs.plugins.gradleutils
}

group = 'local'
description = 'Common build logic for Forge and its subprojects.'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

dependencies {
    compileOnly libs.nulls
    compileOnly libs.gradle

    implementation libs.gradleutils.shared

    implementation libs.bundles.asm
    implementation libs.srgutils
    implementation libs.gson
}

license {
    header = rootProject.file('../LICENSE-header.txt')
    newLine = false
    exclude '**/*.properties'
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.optimizationOptions.indy = true
}

gradlePlugin {
    plugins.register('build-logic') {
        id = 'net.minecraftforge.forge.build'
        implementationClass = 'net.minecraftforge.forge.build.BuildLogicPlugin'
    }
}
