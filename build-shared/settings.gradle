plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'build-shared'

dependencyResolutionManagement {
    repositories {
        gradlePluginPortal()
    }

    //@formatter:off
    versionCatalogs.register('libs') {
        plugin 'licenser',    'net.minecraftforge.licenser'    version '1.2.0'  // https://plugins.gradle.org/plugin/net.minecraftforge.licenser
        plugin 'gradleutils', 'net.minecraftforge.gradleutils' version '3.3.0' // https://plugins.gradle.org/plugin/net.minecraftforge.gradleutils

        library 'gradleutils', 'net.minecraftforge.gradleutils', 'net.minecraftforge.gradleutils.gradle.plugin' version '3.3.0'
    }
    //@formatter:on
}
