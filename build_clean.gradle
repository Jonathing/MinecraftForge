plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle.patcher'
}

evaluationDependsOn(':mcp')

java.toolchain.languageVersion = JavaLanguageVersion.of(gradleutils.unpack(libs.versions.java))

dependencies {
	implementation(libs.forgespi)
}

patcher {
	parent = project(':mcp')
	mcVersion = minecraftVersion
	patchedSrc = file('src/main/java')

	mappings channel: gradleutils.unpack(libs.versions.mappings.channel), version: gradleutils.unpack(libs.versions.mappings.version)

