tasks.named('applyPatches', ApplyPatches) {
    logLevel = 'WARN'
    failOnError = providers.gradleProperty('net.minecraftforge.forge.build.updating').<boolean>map { !Boolean.parseBoolean(it) }
    rejects = rootProject.layout.projectDirectory.dir('rejects')
    archiveRejects.unset()
}

afterEvaluate {
    if (!patcher.srgPatches) {
        /*
        srg2mcpClean {
            dependsOn = []
            input = project(':mcp').setupMCP.output
        }
         */
        tasks.getByName('userdevJar').enabled = true
        def patches = project.file('build/genPatchesForUserdev/output/')
        patches.mkdirs()
        def genPatchesForUserdev = tasks.register('genPatchesForUserdev', GeneratePatches) {
            input = setupMCP.output
            modified = applyRangeMapBase.output
            basePathPrefix = genPatches.basePathPrefix
            modifiedPathPrefix = genPatches.modifiedPathPrefix
            output = patches
            autoHeader = true
            lineEndings = '\n'
        }
        bakePatches {
            dependsOn = []
            input = genPatchesForUserdev.get().output
        }
    }
}

